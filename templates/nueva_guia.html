<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso por guía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
{% include '_menu.html' %}

<h1 class="mb-4">Ingreso por guía</h1>

<div class="row g-3 mb-3">
    <div class="col-md-4">
        <label class="form-label" for="documento">N° de guía</label>
        <input id="documento" class="form-control" autofocus>
    </div>
    <div class="col-md-5">
        <label class="form-label" for="cliente">Cliente</label>
        <input id="cliente" class="form-control" list="listaClientes" autocomplete="off">
        <datalist id="listaClientes">
            {% for c in clientes %}<option value="{{ c }}">{% endfor %}
        </datalist>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button type="button" id="btnAgregar" class="btn btn-primary w-100" onclick="nueva()" disabled>+ Agregar partida</button>
    </div>
</div>

<div id="errGuia" class="alert alert-danger d-none"></div>

<table class="table table-striped table-bordered shadow-sm">
    <thead class="table-primary">
        <tr>
            <th>Partida</th><th id="thCrudo" class="d-none">Cód. crudo</th><th>Artículo</th>
            <th>Color</th><th>Cód. color</th><th>Rollos</th><th>Kilos</th><th>Peso</th><th>Acciones</th>
        </tr>
    </thead>
    <tbody id="filas"></tbody>
</table>

<div class="d-flex justify-content-between align-items-center">
    <strong id="totales"></strong>
    <button type="button" id="btnCargar" class="btn btn-success btn-lg" onclick="cargarGuia()" disabled>Cargar guía</button>
</div>

<!-- Ventana modal -->
<div class="modal fade" id="modalPartida" tabindex="-1">
    <div class="modal-dialog">
        <form class="modal-content" id="formPartida">
            <div class="modal-header">
                <h5 class="modal-title" id="tituloModal">Agregar partida</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div id="errModal" class="alert alert-danger d-none"></div>
                <div class="row g-3">
                    <div class="col-6">
                        <label class="form-label" for="numero">N° de partida</label>
                        <input id="numero" class="form-control" required>
                    </div>
                    <div class="col-6" id="boxCrudo">
                        <label class="form-label" for="codigo_crudo">Código de crudo</label>
                        <input id="codigo_crudo" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label" for="articulo">Artículo</label>
                        <input id="articulo" class="form-control" list="listaArticulos"
                               placeholder="Escriba para buscar el artículo..." autocomplete="off" required>
                        <datalist id="listaArticulos">
                            {% for a in articulos %}<option value="{{ a }}">{% endfor %}
                        </datalist>
                    </div>
                    <div class="col-8">
                        <label class="form-label" for="color">Color</label>
                        <input id="color" class="form-control" required>
                    </div>
                    <div class="col-4">
                        <label class="form-label" for="codcolor">Cód. color</label>
                        <input id="codcolor" class="form-control">
                    </div>
                    <div class="col-4">
                        <label class="form-label" for="rollos">Rollos</label>
                        <input id="rollos" type="number" min="1" step="1" class="form-control" required>
                    </div>
                    <div class="col-4">
                        <label class="form-label" for="kilos">Kilos</label>
                        <input id="kilos" type="number" min="0" step="any" class="form-control" required>
                    </div>
                    <div class="col-4">
                        <label class="form-label" for="peso">Peso</label>
                        <input id="peso" type="number" min="0" step="any" class="form-control" required>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-success" onclick="guardarYCerrar()">Guardar</button>
                <button type="submit" id="btnOtra" class="btn btn-primary">Guardar y agregar otra</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const CAMPOS = ['numero', 'codigo_crudo', 'articulo', 'color', 'codcolor', 'rollos', 'kilos', 'peso'];
const partidas = [];
let editando = -1;
let cargado = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const modal = new bootstrap.Modal($('modalPartida'));

function esCrexsa() {
    return $('cliente').value.toUpperCase().includes('CREXSA');
}

function revisarCabecera() {
    $('btnAgregar').disabled = !($('documento').value.trim() && $('cliente').value.trim());
    dibujar();
}

function dibujar() {
    const crexsa = esCrexsa();
    $('thCrudo').classList.toggle('d-none', !crexsa);
    let rollos = 0, kilos = 0;
    $('filas').innerHTML = partidas.map((p, i) => {
        rollos += Number(p.rollos) || 0;
        kilos += Number(p.kilos) || 0;
        return `<tr>
            <td>${esc(p.numero)}</td>
            ${crexsa ? `<td>${esc(p.codigo_crudo)}</td>` : ''}
            <td>${esc(p.articulo)}</td><td>${esc(p.color)}</td><td>${esc(p.codcolor)}</td>
            <td>${esc(p.rollos)}</td><td>${esc(p.kilos)}</td><td>${esc(p.peso)}</td>
            <td class="text-nowrap">
                <button type="button" class="btn btn-sm btn-warning" onclick="editar(${i})">Editar</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="quitar(${i})">Quitar</button>
            </td>
        </tr>`;
    }).join('');
    $('totales').textContent = `Partidas: ${partidas.length} · Rollos: ${rollos} · Kilos: ${kilos.toFixed(2)}`;
    $('btnCargar').disabled = partidas.length === 0;
}


function prepararModal(conservarDatos) {
    const datos = {};

    if (conservarDatos) {
        ['articulo', 'color', 'codcolor'].forEach(k => {
            datos[k] = $(k).value;
        });
    }

    $('formPartida').reset();

    Object.entries(datos).forEach(([k, v]) => {
        $(k).value = v;
    });

    $('errModal').classList.add('d-none');

    const crexsa = esCrexsa();
    $('boxCrudo').classList.toggle('d-none', !crexsa);
    $('codigo_crudo').required = crexsa;
}


function nueva() {
    editando = -1;
    prepararModal(false);
    $('tituloModal').textContent = 'Agregar partida';
    $('btnOtra').classList.remove('d-none');
    modal.show();
}

function editar(i) {
    editando = i;
    prepararModal(false);
    CAMPOS.forEach(k => $(k).value = partidas[i][k] ?? '');
    $('tituloModal').textContent = 'Editar partida';
    $('btnOtra').classList.add('d-none');
    modal.show();
}

function quitar(i) {
    if (confirm('¿Quitar la partida ' + partidas[i].numero + ' de la guía?')) {
        partidas.splice(i, 1);
        dibujar();
    }
}

function errorModal(mensaje) {
    $('errModal').textContent = mensaje;
    $('errModal').classList.remove('d-none');
}

function guardar(cerrar) {
    const p = {};
    CAMPOS.forEach(k => p[k] = $(k).value.trim());
    const otras = partidas.filter((_, i) => i !== editando);

    if (otras.some(o => o.numero.toLowerCase() === p.numero.toLowerCase())) {
        return errorModal('La partida ' + p.numero + ' ya está en esta guía.');
    }
    if (esCrexsa() && otras.some(o => o.codigo_crudo.toLowerCase() === p.codigo_crudo.toLowerCase())) {
        return errorModal('El código de crudo ' + p.codigo_crudo + ' ya está en esta guía.');
    }

    if (editando >= 0) partidas[editando] = p; else partidas.push(p);
    dibujar();

    if (cerrar || editando >= 0) {
        modal.hide();
    } else {
        prepararModal(true);
        $('numero').focus();
    }
}

function guardarYCerrar() {
    if ($('formPartida').reportValidity()) guardar(true);
}

$('formPartida').addEventListener('submit', e => {
    e.preventDefault();
    guardar(false);
});
$('modalPartida').addEventListener('shown.bs.modal', () => $('numero').focus());

async function cargarGuia() {
    if (!confirm(`¿Cargar ${partidas.length} partidas de la guía ${$('documento').value.trim()}?`)) return;
    $('btnCargar').disabled = true;
    $('errGuia').classList.add('d-none');
    try {
        const r = await fetch('/nueva_guia', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                documento: $('documento').value.trim(),
                cliente: $('cliente').value.trim(),
                partidas: partidas
            })
        });
        const d = await r.json();
        if (d.ok) {
            cargado = true;
            window.location.href = '/';
            return;
        }
        $('errGuia').textContent = d.error;
    } catch (e) {
        $('errGuia').textContent = 'No se pudo cargar la guía. Revisa la terminal de la aplicación.';
    }
    $('errGuia').classList.remove('d-none');
    $('btnCargar').disabled = false;
}

// Avisa si intentan salir con partidas sin cargar
window.addEventListener('beforeunload', e => {
    if (partidas.length && !cargado) {
        e.preventDefault();
        e.returnValue = '';
    }
});

$('documento').addEventListener('input', revisarCabecera);
$('cliente').addEventListener('input', revisarCabecera);
revisarCabecera();
</script>
</body>
</html>
