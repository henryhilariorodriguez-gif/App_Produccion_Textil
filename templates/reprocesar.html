<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Reprocesar partida</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-info text-white">
            <h4 class="mb-0">🔄 Reprocesar partida</h4>
        </div>

        <div class="card-body">

            <h5>Partida: {{ partida.NumeroPartida }}</h5>

            <p>
                <strong>Artículo:</strong>
                {{ partida.Articulo }}
            </p>

            <p>
                <strong>Proceso actual:</strong>
                {{ partida.ProcesoActual }}
            </p>

            <hr>

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        ¿Desde qué proceso debe volver?
                    </label>

                    <select
                        name="proceso_reproceso"
                        class="form-select"
                        required>

                        <option value="">
                            Seleccione un proceso
                        </option>

                        {% for proceso in procesos %}

                            <option value="{{ proceso.Proceso }}">
                                {{ proceso.Proceso }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Motivo del reproceso
                    </label>

                    <select
                       name="motivo"
                       id="motivo"
                     class="form-select"
                     required>

                         <option value="">
                              Seleccione un motivo
                         </option>

                         <option value="Calidad">
                              Calidad
                         </option>

                         <option value="Tono">
                              Tono
                         </option>

                             <option value="Peso">
                          Peso
                             </option>

                         <option value="Otro">
                             Otro
                             </option>

                        </select>

                <div id="otroMotivo" class="mt-2" style="display: none;">

    <label class="form-label">
        Especifique el motivo
    </label>

    <input
        type="text"
        id="motivoOtroTexto"
        name="motivo_otro"
        class="form-control"
        placeholder="Escriba aquí el motivo">

</div>

                <div class="mb-3">

                    <label class="form-label">
                        Supervisor
                    </label>

                    <input
                        type="text"
                        name="supervisor"
                        class="form-control"
                        placeholder="Nombre del supervisor"
                        required>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Confirmar reproceso
                </button>

                <a
                    href="/"
                    class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>
<script>

const motivo = document.getElementById("motivo");
const otroMotivo = document.getElementById("otroMotivo");

motivo.addEventListener("change", function () {

    if (this.value === "Otro") {
        otroMotivo.style.display = "block";
    } else {
        otroMotivo.style.display = "none";
    }

});

</script>

</body>
</html>

</body>
</html>
