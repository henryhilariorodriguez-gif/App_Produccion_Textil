<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Partida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
      <div class="container-fluid">
        <a class="navbar-brand" href="/">ERP Textil</a>
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/">Listado</a></li>
          <li class="nav-item"><a class="nav-link active" href="/editar_partida">Editar Partida</a></li>
        </ul>
      </div>
    </nav>

    <h1 class="mb-4">Editar Partida</h1>

    <form method="POST" class="card p-4 shadow-sm">
        <div class="mb-3"><label class="form-label">Número de Partida</label>
            <input type="text" class="form-control" value="{{ partida.NumeroPartida }}" readonly></div>
        <div class="mb-3"><label class="form-label">Cliente</label>
            <input type="text" class="form-control" name="cliente" value="{{ partida.Cliente }}" required></div>
        <div class="mb-3"><label class="form-label">Color</label>
            <input type="text" class="form-control" name="color" value="{{ partida.Color }}" required></div>
        <div class="mb-3"><label class="form-label">Rollos</label>
            <input type="number" class="form-control" name="rollos" value="{{ partida.Rollos }}" required></div>
        <div class="mb-3"><label class="form-label">Kilos</label>
            <input type="number" step="0.01" class="form-control" name="kilos" value="{{ partida.Kilos }}" required></div>
        <div class="mb-3"><label class="form-label">Artículo</label>
            <input type="text" class="form-control" name="articulo" value="{{ partida.Articulo }}"></div>
        <div class="mb-3"><label class="form-label">Proceso Actual</label>
            <input type="text" class="form-control" name="proceso" value="{{ partida.ProcesoActual }}" readonly></div>
        <div class="mb-3"><label class="form-label">Estado</label>
            <select class="form-select" name="estado" required>
                <option value="En proceso" {% if partida.Estado == "En proceso" %}selected{% endif %}>En proceso</option>
                <option value="Finalizado" {% if partida.Estado == "Finalizado" %}selected{% endif %}>Finalizado</option>
                <option value="Pendiente" {% if partida.Estado == "Pendiente" %}selected{% endif %}>Pendiente</option>
            </select></div>
        <div class="mt-4">
            <button type="submit" class="btn btn-success btn-lg">💾 Guardar</button>
            <a href="/" class="btn btn-danger btn-lg">❌ Cancelar</a>
        </div>
    </form>

</body>
