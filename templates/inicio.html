<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
{% include '_menu.html' %}

<div class="container-fluid p-4">
    <h1 class="mb-1">Panel de control</h1>
    <p class="text-muted mb-4">Resumen de la producción</p>

    <div class="row g-3">
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <small class="text-muted text-uppercase">Partidas activas</small>
                <div class="display-5 fw-bold">{{ activas }}</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <small class="text-muted text-uppercase">Pendientes</small>
                <div class="display-5 fw-bold text-warning">{{ pendientes }}</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm p-3">
                <small class="text-muted text-uppercase">Despachadas</small>
                <div class="display-5 fw-bold text-success">{{ despachadas }}</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
